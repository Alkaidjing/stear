<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>梦角模拟器</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #ededed; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* 顶部标题栏 */
  header { padding: 12px 16px; background: #f7f7f7; border-bottom: 1px solid #dcdcdc; font-weight: bold; text-align: center; font-size: 16px; flex-shrink: 0; }
  
  /* 聊天区 */
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  
  /* 消息气泡 */
  .msg-wrap { display: flex; align-items: flex-start; gap: 8px; max-width: 85%; }
  .msg-wrap.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-wrap.char { align-self: flex-start; }
  
  /* 头像 */
  .avatar { width: 40px; height: 40px; border-radius: 4px; background: #ccc; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; cursor: pointer; }
  .avatar.user { background: #07c160; }
  .avatar.char { background: #576b95; }
  
  .msg { padding: 10px 14px; border-radius: 6px; line-height: 1.5; font-size: 15px; word-wrap: break-word; position: relative; }
  .msg.user { background: #95ec69; }
  .msg.char { background: #fff; }
  
  /* 特殊消息：红包与图片 */
  .msg.redpacket { background: #fa9d3b; color: #fff; display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 6px; }
  .msg.redpacket::before { content: "🧧"; font-size: 20px; }
  .msg.image { padding: 0; background: transparent; }
  .msg.image img { max-width: 150px; border-radius: 6px; display: block; }

  /* 拍一拍提示 */
  .pat-msg { align-self: center; font-size: 12px; color: #999; background: #e2e2e2; padding: 4px 10px; border-radius: 12px; margin: 4px 0; }

  /* 底部输入区 */
  footer { padding: 10px; background: #f7f7f7; border-top: 1px solid #dcdcdc; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
  
  /* 工具栏（表情、红包、设置） */
  .toolbar { display: flex; gap: 12px; padding: 0 4px; }
  .toolbar button { background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px; }
  
  /* 输入框 */
  .input-area { display: flex; gap: 8px; align-items: center; }
  .input-area input { flex: 1; height: 40px; padding: 0 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; }
  .input-area button { height: 40px; padding: 0 16px; border: none; border-radius: 6px; background: #07c160; color: #fff; font-size: 15px; cursor: pointer; }
  
  /* 隐藏面板（用于设置台词、表情、红包） */
  .panel { display: none; padding: 10px; background: #fff; border-top: 1px solid #ddd; max-height: 40vh; overflow-y: auto; }
  .panel.active { display: block; }
  .panel textarea { width: 100%; height: 80px; margin-bottom: 8px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  .panel .emoji-list { display: flex; flex-wrap: wrap; gap: 10px; font-size: 24px; }
  .panel .emoji-list span { cursor: pointer; }
  .panel button { padding: 8px 12px; background: #07c160; color: #fff; border: none; border-radius: 6px; font-size: 14px; }
</style>
</head>
<body>

<header>梦角聊天</header>

<div id="chat">
  <div class="pat-msg" style="display:none;"></div>
</div>

<!-- 各种功能面板 -->
<div id="panel-card" class="panel">
  <p style="font-size:12px; color:#666; margin-top:0;">在此输入对方回复的句子，每行一句（随机抽取）：</p>
  <textarea id="cardText">【微笑】“今天天气真好，要一起出去走走吗？”
【沉默】……（对方转过头，没有看你的眼睛）
【认真】“我觉得这件事情还有转机，别放弃。”
【脸红】“你、你刚才说什么？我没听清……”
【假装生气】“哼，你再这样我就生气了。”</textarea>
  <button onclick="saveCards()">保存字卡</button>
</div>

<div id="panel-emoji" class="panel">
  <div class="emoji-list">
    <span onclick="sendEmoji('😊')">😊</span>
    <span onclick="sendEmoji('😂')">😂</span>
    <span onclick="sendEmoji('🥺')">🥺</span>
    <span onclick="sendEmoji('❤️')">❤️</span>
    <span onclick="sendEmoji('🐱')">🐱</span>
    <span onclick="sendEmoji('🌸')">🌸</span>
    <span onclick="sendEmoji('👍')">👍</span>
    <span onclick="sendEmoji('🍉')">🍉</span>
  </div>
</div>

<footer>
  <div class="toolbar">
    <button title="字卡设置" onclick="togglePanel('panel-card')">⚙️</button>
    <button title="表情包" onclick="togglePanel('panel-emoji')">😊</button>
    <button title="发红包" onclick="sendRedPacket()">🧧</button>
  </div>
  <div class="input-area">
    <input type="text" id="input" placeholder="输入台词..." autocomplete="off">
    <button id="send">发送</button>
  </div>
</footer>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

// 默认字卡库
let replyCards = [
  "【微笑】“今天天气真好，要一起出去走走吗？”",
  "【沉默】……（对方转过头，没有看你的眼睛）",
  "【认真】“我觉得这件事情还有转机，别放弃。”",
  "【脸红】“你、你刚才说什么？我没听清……”"
];

// 打开/关闭面板
function togglePanel(id) {
  const panels = document.querySelectorAll('.panel');
  panels.forEach(p => {
    if (p.id === id && !p.classList.contains('active')) {
      p.classList.add('active');
    } else {
      p.classList.remove('active');
    }
  });
}

// 渲染消息 (包含文字、表情、红包)
function addMsg(role, content, type = 'text') {
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + role;
  
  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + role;
  avatar.textContent = role === 'user' ? '我' : '梦';
  avatar.ondblclick = () => pat(role); // 双击头像拍一拍
  // 手机端双击替代方案
  let lastTap = 0;
  avatar.addEventListener('touchend', (e) => {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTap;
    if (tapLength < 300 && tapLength > 0) {
      e.preventDefault();
      pat(role);
    }
    lastTap = currentTime;
  });

  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  
  if (type === 'redpacket') {
    msg.classList.add('redpacket');
    msg.textContent = content;
  } else if (type === 'image') {
    msg.classList.add('image');
    msg.innerHTML = `<img src="${content}" alt="表情">`;
  } else {
    msg.textContent = content;
  }
  
  wrap.appendChild(avatar);
  wrap.appendChild(msg);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}

// 普通文本发送
function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  
  addMsg('user', text);
  
  // 模拟对方回复
  setTimeout(() => {
    if (replyCards.length > 0) {
      const randomCard = replyCards[Math.floor(Math.random() * replyCards.length)];
      addMsg('char', randomCard);
    }
  }, 800);
}

// 发送表情包
function sendEmoji(emoji) {
  addMsg('user', emoji);
  togglePanel(''); // 关面板
  setTimeout(() => {
    addMsg('char', '【看了看你发的表情】');
  }, 800);
}

// 发红包
function sendRedPacket() {
  addMsg('user', '恭喜发财，大吉大利', 'redpacket');
  togglePanel('');
  setTimeout(() => {
    addMsg('char', '【领了你的红包】谢谢你！');
  }, 1000);
}

// 拍一拍
function pat(role) {
  const patMsg = document.createElement('div');
  patMsg.className = 'pat-msg';
  if (role === 'user') {
    patMsg.textContent = '梦角 拍了拍 我';
  } else {
    patMsg.textContent = '我 拍了拍 梦角';
    setTimeout(() => {
        addMsg('char', '【疑惑】你拍我干嘛？');
    }, 600);
  }
  chatEl.appendChild(patMsg);
  chatEl.scrollTop = chatEl.scrollHeight;
}

// 保存自定义字卡
function saveCards() {
  const text = document.getElementById('cardText').value;
  replyCards = text.split('\n').filter(line => line.trim() !== '');
  alert('字卡保存成功！');
  togglePanel('');
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); send(); }
});
</script>
</body>
</html>
