<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>字卡聊天</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f7; }
  .app { max-width: 720px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 8px; align-items: center; }
  header input[type=file] { font-size: 12px; }
  #charName { font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 12px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #007aff; color: #fff; }
  .msg.char { align-self: flex-start; background: #fff; border: 1px solid #e5e5ea; }
  footer { padding: 10px 16px; background: #fff; border-top: 1px solid #ddd; display: flex; gap: 8px; }
  footer textarea { flex: 1; resize: none; height: 44px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font: inherit; }
  footer button { padding: 0 16px; border: none; border-radius: 8px; background: #007aff; color: #fff; font: inherit; cursor: pointer; }
  footer button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <input type="file" id="cardFile" accept=".json,application/json" />
    <span id="charName">未导入角色卡</span>
  </header>
  <div id="chat"></div>
  <footer>
    <textarea id="input" placeholder="说点什么…"></textarea>
    <button id="send">发送</button>
  </footer>
</div>
<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const nameEl = document.getElementById('charName');
const cardFile = document.getElementById('cardFile');

let card = null; // { name, persona, firstMessage, example }
let history = []; // [{ role: 'user'|'assistant', content }]

// 导入角色卡（JSON）
cardFile.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    card = {
      name: data.name || data.char_name || '角色',
      persona: data.persona || data.description || data.char_persona || '',
      firstMessage: data.firstMessage || data.first_mes || data.greeting || '',
      example: data.example || data.mes_example || ''
    };
    nameEl.textContent = card.name;
    history = [];
    chatEl.innerHTML = '';
    if (card.firstMessage) addMsg('char', card.firstMessage);
  } catch (err) {
    alert('角色卡解析失败：' + err.message);
  }
});

function addMsg(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = content;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function buildPrompt() {
  const sys = [
    `你是${card.name}。`,
    card.persona ? `人设：${card.persona}` : '',
    card.example ? `对话示例：${card.example}` : '',
    '请始终保持角色设定，用第一人称回复，不要跳出角色。'
  ].filter(Boolean).join('\n');
  const messages = [{ role: 'system', content: sys }];
  history.forEach(m => messages.push(m));
  return messages;
}

// 本地模拟回复（没有 API 时先跑通界面）
function mockReply(userText) {
  const replies = [
    `（${card.name}看了你一眼）你刚才说“${userText}”，我想了想……`,
    `嗯，我在听。关于“${userText}”，我有些想法。`,
    `你这么说，我倒是没想到。再说说？`
  ];
  return replies[Math.floor(Math.random() * replies.length)];
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || !card) return;
  inputEl.value = '';
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  sendBtn.disabled = true;

  try {
    // 这里替换成你的 API 调用；默认用本地模拟
    const reply = mockReply(text);
    // 模拟延迟
    await new Promise(r => setTimeout(r, 600));
    addMsg('char', reply);
    history.push({ role: 'assistant', content: reply });
    // 本地保存
    localStorage.setItem('card_chat_history', JSON.stringify(history));
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
